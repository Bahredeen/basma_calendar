name: Build Basma Calendar (.apk & .exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - run: flutter create . --platforms=android --org=com.basma.calendar
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: BasmaCalendar-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-exe:
    name: Build Windows EXE
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - run: flutter config --enable-windows-desktop
      - run: flutter create . --platforms=windows --org=com.basma.calendar
      - run: flutter pub get
      - run: flutter build windows --release
      - run: |
          copy "C:\Windows\System32\vcruntime140.dll" "build\windows\x64\runner\Release\"
          copy "C:\Windows\System32\vcruntime140_1.dll" "build\windows\x64\runner\Release\"
          copy "C:\Windows\System32\msvcp140.dll" "build\windows\x64\runner\Release\"
          copy "C:\Windows\System32\msvcp140_1.dll" "build\windows\x64\runner\Release\"
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: BasmaCalendar-Windows-EXE
          path: build/windows/x64/runner/Release/
