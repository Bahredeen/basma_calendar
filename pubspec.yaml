name: ethiopian_calendar
description: የኢትዮጵያውያን ቀን አቆጣጠር Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/ethiopian_flag.png"
  windows:
    generate: true
    image_path: "assets/icon/ethiopian_flag.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/icon/ethiopian_flag.png
